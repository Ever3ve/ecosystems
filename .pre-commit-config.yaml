repos:
  - repo: local
    hooks:
      - id: dotnet-format
        name: Check .NET formatting
        entry: dotnet format ecosystems.sln --verify-no-changes
        language: system
        pass_filenames: false
        stages: [pre-commit]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
